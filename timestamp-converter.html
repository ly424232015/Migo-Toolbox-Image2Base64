<script>
    let currentLang = 'zh';

    function switchLang(lang) {
        currentLang = lang;
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.lang-btn[onclick="switchLang(\'' + lang + '\')"]').classList.add('active');
        document.querySelectorAll('[data-' + lang + ']').forEach(el => {
            const val = el.getAttribute('data-' + lang);
            if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') { el.placeholder = val; }
            else { el.innerHTML = val; }
        });
        
        const displayLocal = document.getElementById('displayLocal');
        if (displayLocal && displayLocal.textContent) {
            const ms = document.getElementById('displayMs').textContent;
            if (ms) {
                const locale = lang === 'zh' ? 'zh-CN' : 'en-US';
                displayLocal.textContent = new Date(Number(ms)).toLocaleString(locale);
            }
        }
    }

    function toggleNav() { document.getElementById('navMenu').classList.toggle('show'); }
    document.addEventListener('click', function(e) {
        const d = document.querySelector('.nav-dropdown');
        if (d && !d.contains(e.target)) document.getElementById('navMenu').classList.remove('show');
    });

    function getCurrentTimestamp() {
        const now = Date.now();
        const useMilliseconds = document.getElementById('milliseconds').checked;
        
        if (useMilliseconds) {
            document.getElementById('timestampInput').value = now;
        } else {
            document.getElementById('timestampInput').value = Math.floor(now / 1000);
        }
        
        updateDateTimeInput(now);
        displayTimestampDetails(now);
    }

    function timestampToDate() {
        let timestamp = Number(document.getElementById('timestampInput').value);
        if (!timestamp) return;
        
        const useMilliseconds = document.getElementById('milliseconds').checked;
        
        if (!useMilliseconds) {
            timestamp = timestamp * 1000;
        }
        
        updateDateTimeInput(timestamp);
        displayTimestampDetails(timestamp);
    }

    function dateToTimestamp() {
        const datetimeInput = document.getElementById('datetimeInput').value;
        if (!datetimeInput) return;
        
        const date = new Date(datetimeInput);
        const timestamp = date.getTime();
        
        const useMilliseconds = document.getElementById('milliseconds').checked;
        
        if (useMilliseconds) {
            document.getElementById('timestampInput').value = timestamp;
        } else {
            document.getElementById('timestampInput').value = Math.floor(timestamp / 1000);
        }
        
        displayTimestampDetails(timestamp);
    }

    function updateDateTimeInput(timestampMs) {
        const date = new Date(timestampMs);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        
        document.getElementById('datetimeInput').value = `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    function displayTimestampDetails(timestampMs) {
        const display = document.getElementById('timestampDisplay');
        display.style.display = 'block';
        
        const date = new Date(timestampMs);
        const locale = currentLang === 'zh' ? 'zh-CN' : 'en-US';
        
        document.getElementById('displayMs').textContent = timestampMs;
        document.getElementById('displaySec').textContent = Math.floor(timestampMs / 1000);
        document.getElementById('displayIso').textContent = date.toISOString();
        document.getElementById('displayLocal').textContent = date.toLocaleString(locale);
    }

    function copyTimestamp() {
        const val = document.getElementById('timestampInput').value;
        if (val) navigator.clipboard.writeText(val).catch(() => { const t = document.createElement('textarea'); t.value = val; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); });
    }

    function copyDateTime() {
        const val = document.getElementById('datetimeInput').value;
        if (val) navigator.clipboard.writeText(val).catch(() => { const t = document.createElement('textarea'); t.value = val; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); });
    }

    function clearAll() {
        document.getElementById('timestampInput').value = '';
        document.getElementById('datetimeInput').value = '';
        document.getElementById('timestampDisplay').style.display = 'none';
    }
</script>
