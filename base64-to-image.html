<script>
    let currentLang = 'zh';
    let decodedImageSrc = '';
    let detectedMime = 'image/png';

    function switchLang(lang) {
        currentLang = lang;
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.lang-btn[onclick="switchLang('${lang}')"]`).classList.add('active');
        document.querySelectorAll('[data-' + lang + ']').forEach(el => {
            const val = el.getAttribute('data-' + lang);
            if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') { el.placeholder = val; }
            else { el.innerHTML = val; }
        });
    }

    function toggleNav() { document.getElementById('navMenu').classList.toggle('show'); }
    document.addEventListener('click', function(e) {
        const d = document.querySelector('.nav-dropdown');
        if (d && !d.contains(e.target)) document.getElementById('navMenu').classList.remove('show');
    });

    function convertToImage() {
        const input = document.getElementById('base64Input').value.trim();
        if (!input) {
            alert(currentLang === 'zh' ? '请输入 Base64 字符串！' : 'Please enter a Base64 string!');
            return;
        }

        let src = input;
        let mime = 'image/png';

        if (input.startsWith('data:')) {
            src = input;
            const match = input.match(/^data:([^;]+);base64,/);
            if (match) mime = match[1];
        } else {
            const lower = input.substring(0, 20).toLowerCase();
            if (lower.startsWith('/9j/')) mime = 'image/jpeg';
            else if (lower.startsWith('iVBOR')) mime = 'image/png';
            else if (lower.startsWith('uuxg')) mime = 'image/webp';
            else if (lower.startsWith('r0lg')) mime = 'image/gif';
            else if (lower.startsWith('qk3e')) mime = 'image/bmp';
            src = 'data:' + mime + ';base64,' + input;
        }

        detectedMime = mime;
        decodedImageSrc = src;

        const img = document.getElementById('previewImage');
        img.src = src;
        img.onload = function() {
            const infoBar = document.getElementById('infoBar');
            const w = img.naturalWidth, h = img.naturalHeight;
            const bytes = Math.floor(input.replace(/^data:[^;]+;base64,/, '').length * 3 / 4);
            const sizeLabel = currentLang === 'zh' ? '大小' : 'Size';
            const dimLabel = currentLang === 'zh' ? '尺寸' : 'Dimensions';
            const formatLabel = currentLang === 'zh' ? '格式' : 'Format';
            const sizeStr = bytes > 1048576 ? (bytes / 1048576).toFixed(2) + ' MB' : (bytes / 1024).toFixed(1) + ' KB';
            infoBar.innerHTML = `
                <span>📐 ${dimLabel}: ${w} × ${h}px</span>
                <span>💾 ${sizeLabel}: ${sizeStr}</span>
                <span class="size-badge">${formatLabel}: ${mime.split('/')[1].toUpperCase()}</span>
            `;
        };

        document.getElementById('previewWrapper').classList.add('show');
        document.getElementById('downloadRow').style.display = 'flex';
    }

    function downloadImage(format) {
        if (!decodedImageSrc) return;

        const canvas = document.createElement('canvas');
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext('2d');
            if (format === 'jpg') {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            ctx.drawImage(img, 0, 0);
            const mimeMap = { png: 'image/png', jpg: 'image/jpeg', webp: 'image/webp' };
            const mime = mimeMap[format] || 'image/png';
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'decoded-image.' + format;
                a.click();
                URL.revokeObjectURL(url);
            }, mime, 0.92);
        };
        img.src = decodedImageSrc;
    }

    function clearAll() {
        document.getElementById('base64Input').value = '';
        document.getElementById('previewWrapper').classList.remove('show');
        document.getElementById('downloadRow').style.display = 'none';
        document.getElementById('previewImage').src = '';
        document.getElementById('infoBar').innerHTML = '';
        decodedImageSrc = '';
    }
</script>
