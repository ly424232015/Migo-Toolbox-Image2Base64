    // SHA-1 Implementation
    function sha1(msg) {
        function rotateLeft(n, s) { return (n << s) | (n >>> (32 - s)); }
        function utf8Encode(str) {
            str = str.replace(/\r\n/g, '\n');
            let out = '';
            for (let n = 0; n < str.length; n++) {
                const c = str.charCodeAt(n);
                if (c < 128) {
                    out += String.fromCharCode(c);
                } else if ((c > 127) && (c < 2048)) {
                    out += String.fromCharCode((c >> 6) | 192);
                    out += String.fromCharCode((c & 63) | 128);
                } else {
                    out += String.fromCharCode((c >> 12) | 224);
                    out += String.fromCharCode(((c >> 6) & 63) | 128);
                    out += String.fromCharCode((c & 63) | 128);
                }
            }
            return out;
        }
        function hex(num) {
            let str = '';
            let v;
            for (let i = 7; i >= 0; i--) {
                v = (num >>> (i * 4)) & 0x0f;
                str += v.toString(16);
            }
            return str;
        }

        msg = utf8Encode(msg);
        let ml = msg.length * 8;
        let wa = [];
        for (let i = 0; i < msg.length; i++) {

        wa[msg.length >> 2] |= 0x80 << (24 - (msg.length % 4) * 8);
        wa[((msg.length + 8) >> 6 << 4) + 15] = ml;

        let h0 = 1732584193, h1 = -271733879, h2 = -1732584194, h3 = 271733878, h4 = -1009589776;

        for (let i = 0; i < wa.length; i += 16) {

            for (let j = 0; j < 80; j++) {

            }
            h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0;
            h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
        }
        return (hex(h0) + hex(h1) + hex(h2) + hex(h3) + hex(h4) + hex(h5) + hex(h6) + hex(h7)).toLowerCase();
    }

    function getBinaryString(arrayBuffer) {
        const bytes = new Uint8Array(arrayBuffer);
        let binary = '';
        for (let i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return binary;
    }

    function displayHashes(binary) {
        const container = document.getElementById('outputContainer');
        container.innerHTML = '';
        container.style.display = 'block';

        if (document.getElementById('sha1Check').checked) {
            const sha1Hash = sha1(binary);
            const div = document.createElement('div');
            div.className = 'output-box';
            div.innerHTML = `
                <label>SHA1:</label>
                <div class="output-text">${sha1Hash}</div>
                <button class="action-btn" onclick="copyText('${sha1Hash}')" data-en="📋 Copy SHA1" data-zh="📋 复制 SHA1">📋 Copy SHA1</button>
            `;
            container.appendChild(div);
        }

        if (document.getElementById('sha256Check').checked) {
            const sha256Hash = sha256(binary);
            const div = document.createElement('div');
            div.className = 'output-box';
            div.innerHTML = `
                <label>SHA256:</label>
                <div class="output-text">${sha256Hash}</div>
                <button class="action-btn" onclick="copyText('${sha256Hash}')" data-en="📋 Copy SHA256" data-zh="📋 复制 SHA256">📋 Copy SHA256</button>
            `;
            container.appendChild(div);
        }

        if (currentLang === 'zh') {
            container.querySelectorAll('[data-zh]').forEach(el => {
                el.textContent = el.getAttribute('data-zh');
            });
        }
    }

    function hashText() {
        const text = document.getElementById('textInput').value;
        if (!text) {
            alert(currentLang === 'zh' ? '请输入文本' : 'Please enter text');
            return;
        }
        if (!document.getElementById('sha1Check').checked && !document.getElementById('sha256Check').checked) {
            alert(currentLang === 'zh' ? '请至少选择一个哈希算法' : 'Please select at least one hash algorithm');
            return;
        }
        displayHashes(text);
    }

    function hashFile() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) return;
        
        document.getElementById('fileInfo').textContent = (currentLang === 'zh' ? '文件名: ' : 'File: ') + file.name + ' (' + (file.size / 1024).toFixed(2) + ' KB)';
        
        if (!document.getElementById('sha1Check').checked && !document.getElementById('sha256Check').checked) {
            alert(currentLang === 'zh' ? '请至少选择一个哈希算法' : 'Please select at least one hash algorithm');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const binary = getBinaryString(e.target.result);
            displayHashes(binary);
        };
        reader.readAsArrayBuffer(file);
    }

    function copyText(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
    }

    function clearText() {
        document.getElementById('textInput').value = '';
        document.getElementById('outputContainer').style.display = 'none';
    }
</script>
</body>
</html>
